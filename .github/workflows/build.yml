name: Build Android APK - Dr. Malek App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Workspace Files
        run: |
          echo "Dr. Malek Al-Romaimah App CI/CD Workflow initialized."
          echo "Ready for APK packaging and distribution."

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Standard node build for web & mobile wrapper"
            npm ci || npm install
            npm run build
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr_Malek_App_Artifacts
          path: |
            dist/
            *.md
