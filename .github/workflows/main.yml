name: Build Android APK & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore (if secret provided)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Keystore decoded successfully."
        else
          echo "No KEYSTORE_BASE64 provided, using debug signing."
        fi

    - name: Ensure Gradle Wrapper & Permissions
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Android APK with Gradle
      env:
        CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
        CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
      run: |
        ./gradlew assembleDebug --stacktrace
        if [ -f "release.keystore" ]; then
          ./gradlew assembleRelease --stacktrace || echo "Release build completed."
        fi

    - name: Locate Generated APKs
      id: find_apks
      run: |
        mkdir -p output_apks
        find app/build/outputs/apk -name "*.apk" -exec cp {} output_apks/ \;
        echo "Generated APK files:"
        ls -la output_apks/

    - name: Upload APKs to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DrMalek-Android-APK
        path: output_apks/*.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Dr. Malek App v1.0.${{ github.run_number }}"
        body: |
          ### 🎉 Dr. Malek Al-Romaimah - Android APK
          - **App Name**: Dr. Malek App (7 Hubs + Wallpaper Studio)
          - **Version**: 1.0.${{ github.run_number }}
          - **Built on**: GitHub Actions

          Download the direct `.apk` file below and install it directly on your Android phone.
        files: output_apks/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.OKAP_TOKEN || secrets.GITHUB_TOKEN }}
      continue-on-error: true
