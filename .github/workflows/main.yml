name: Build Android APK - Dr. Malek App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and Collect APK
        run: |
          mkdir -p output_apks
          find . -name "*debug*.apk" -type f -exec cp {} output_apks/app-debug.apk \; || true
          ls -la output_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            output_apks/*.apk

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Dr. Malek App v1.0.${{ github.run_number }}"
          body: |
            ### 🎉 تطبيق الدكتور مالك الرميمة - إصدار الأندرويد APK
            - **اسم التطبيق**: Dr. Malek App
            - **الإصدار**: v1.0.${{ github.run_number }}
            - **الحالة**: جاهز للتثبيت المباشر على الهاتف

            اضغط على ملف `app-debug.apk` المرفق في الأسفل لتحميله مباشرة.
          files: |
            app/build/outputs/apk/debug/*.apk
            output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.OKAP_TOKEN || secrets.GITHUB_TOKEN }}
        continue-on-error: true
