name: Build Android APK - Dr. Malek App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Generate Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect Generated APKs
        id: collect
        run: |
          mkdir -p build_output
          find . -name "*debug*.apk" -type f -exec cp {} build_output/DrMalekApp-debug.apk \;
          echo "Generated APKs:"
          ls -la build_output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrMalek-Android-APK
          path: build_output/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "تطبيق الدكتور مالك الرميمة v1.0.${{ github.run_number }}"
          body: |
            ### 📱 تطبيق الدكتور مالك الرميمة - Android APK
            - **الإصدار**: v1.0.${{ github.run_number }}
            - **الحالة**: تم بناء ملف الـ APK بنجاح وجاهز للتحميل والتثبيت المباشر على هاتفك.
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.OKAP_TOKEN || secrets.GITHUB_TOKEN }}
        continue-on-error: true
