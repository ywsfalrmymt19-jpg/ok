name: Build Android APK & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.6

    - name: Build Android APK with Gradle
      run: |
        chmod +x gradlew || true
        gradle :app:assembleDebug --stacktrace --no-daemon

    - name: Collect Generated APKs
      id: collect_apks
      run: |
        mkdir -p output_apks
        find app/build/outputs/apk -name "*.apk" -type f -exec cp {} output_apks/ \;
        echo "Found APK files:"
        ls -la output_apks/

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DrMalek-App-Debug
        path: output_apks/*.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Dr. Malek App v1.0.${{ github.run_number }}"
        body: |
          ### 🎉 Dr. Malek Al-Romaimah - Android APK
          - **App Name**: Dr. Malek App
          - **Build**: Release/Debug APK
          - **Status**: Ready for Direct Install

          Click on the `.apk` file below to download and install on your phone.
        files: output_apks/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.OKAP_TOKEN || secrets.GITHUB_TOKEN }}
      continue-on-error: true
